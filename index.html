            const categories = [
                { id: 'all', label: 'הכל 🍽️' },
                { id: 'salads', label: 'סלטים 🥗' },
                { id: 'soups', label: 'מרקים 🍲' },
                { id: 'mains', label: 'תבשילים 🥘' },
                { id: 'dressings', label: 'רטבים 🥣' },
                { id: 'wraps', label: 'כריכים וטורטיות 🌯' }
            ];

            const filteredRecipes = recipes.filter(recipe => {
                const matchesCategory = selectedCategory === 'all' || recipe.category === selectedCategory;
                const matchesSearch = recipe.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    recipe.ingredients.some(ing => ing.toLowerCase().includes(searchTerm.toLowerCase()));
                return matchesCategory && matchesSearch;
            });

            return (
                <div className="min-h-screen py-8 px-4 sm:px-6 lg:px-8">
                    <div className="max-w-4xl mx-auto">
                        
                        {/* תפריט קטגוריות עליון */}
                        <div className="flex flex-wrap justify-center gap-2 mb-6">
                            {categories.map(cat => (
                                <button
                                    key={cat.id}
                                    onClick={() => setSelectedCategory(cat.id)}
                                    className={`px-4 py-2 rounded-full text-sm font-semibold transition-all duration-200 ${
                                        selectedCategory === cat.id
                                            ? 'bg-green-600 text-white shadow-md scale-105'
                                            : 'bg-white text-gray-700 hover:bg-green-100 border border-green-200'
                                    }`}
                                >
                                    {cat.label}
                                </button>
                            ))}
                        </div>

                        {/* שורת חיפוש */}
                        <div className="mb-6">
                            <input
                                type="text"
                                placeholder="🔍 חפש מתכון או מצרך..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="w-full p-4 rounded-xl border border-green-200 shadow-sm focus:ring-2 focus:ring-green-400 focus:outline-none text-gray-700 bg-white"
                            />
                        </div>

                        <main>
                            {filteredRecipes.length > 0 ? (
                                filteredRecipes.map(recipe => (
                                    <RecipeCard key={recipe.id} recipe={recipe} />
                                ))
                            ) : (
                                <div className="text-center py-10 text-gray-500">
                                    לא נמצאו מתכונים המתאימים לחיפוש שלך בקטגוריה זו.
                                </div>
                            )}
                        </main>

                        <footer className="mt-12 text-center text-gray-400 text-xs">
                            <p>סה"כ {filteredRecipes.length} מתכונים מוצגים (מתוך {recipes.length} במאגר)</p>
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
